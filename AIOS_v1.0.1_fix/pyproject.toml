[project]
name = "aios"
version = "1.0.0"
description = "AI-native desktop with unified runtime, AI control plane, context, memory, and workspace services"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
  "psutil>=6.0,<7",
]

[project.scripts]
aios = "app:main"

[tool.ruff]
line-length = 100
exclude = [".venv"]

[tool.pytest.ini_options]
pythonpath = ["."]
